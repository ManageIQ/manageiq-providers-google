---
:ems:
  :ems_google:
    :blacklisted_event_names: []
    :event_handling:
      :event_groups:
  :ems_gke:
    # High-frequency or routine lifecycle events filtered to reduce queue churn.
    :blacklisted_event_names:
    - CRONJOB_SCALINGREPLICASET
    - DAEMONSET_SCALINGREPLICASET
    - DEPLOYMENT_SCALINGREPLICASET
    - JOB_COMPLETED
    - JOB_SCALINGREPLICASET
    - NODE_NODEHASNODISKPRESSURE
    - NODE_NODEHASSUFFICIENTMEMORY
    - NODE_NODEHASSUFFICIENTPID
    - NODE_STARTING
    - PERSISTENTVOLUMECLAIM_PROVISIONINGSUCCEEDED
    - PERSISTENTVOLUMECLAIM_UNRECOGNIZEDDATASOURCEKIND
    - POD_ADDEDINTERFACE
    - POD_PULLED
    - POD_PULLING
    - POD_SUCCESSFULATTACHVOLUME
    - POD_SUCCESSFULDETACHVOLUME
    - POD_SUCCESSFULMOUNTVOLUME
    - POD_SUCCESSFULUNMOUNTVOLUME
    - REPLICASET_SCALINGREPLICASET
    - REPLICATOR_SCALINGREPLICASET
    - STATEFULSET_SCALINGREPLICASET
:ems_refresh:
  :gce:
    :get_deprecated_images: false
    :inventory_collections:
      :saver_strategy: default
  :gce_network:
    # Disable scheduled full refresh for the network manager as this will be
    # refreshed automatically by the parent cloud manager.
    :refresh_interval: 0
    :inventory_collections:
      :saver_strategy: default
  :gke:
    :streaming_refresh: true
    :chunk_size: 1_000
    :inventory_collections:
      :saver_strategy: batch
:http_proxy:
  :gce:
    :host:
    :password:
    :port:
    :user:
:log:
  :level_gce: info
:workers:
  :worker_base:
    :event_catcher:
      :event_catcher_google:
        :poll: 15.seconds
      :event_catcher_google_gke:
        :poll: 15.seconds
    :queue_worker_base:
      :ems_metrics_collector_worker:
        :ems_metrics_collector_worker_google: {}
      :ems_refresh_worker:
        :ems_refresh_worker_google: {}
        :ems_refresh_worker_google_gke: {}
